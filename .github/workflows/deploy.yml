name: Deploy re-wild-oasis app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /var/www/re-wild-oasis

            git pull origin main

            /home/ubuntu/.nvm/versions/node/v24.15.0/bin/pnpm/pnpm install --frozen-lockfile

            /home/ubuntu/.nvm/versions/node/v24.15.0/bin/pnpm/pnpm run build
