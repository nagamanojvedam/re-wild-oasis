name: Dev Test

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Ubuntu runner
        run: |
          echo "GitHub Actions is running on my Ubuntu server"
          hostname

      - name: Check Docker
        run: docker --version